<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Signal Churn Analytics</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="app-shell" data-active="dashboard" data-title="Dashboard"></div>

<template id="dashboard-template">
  <div class="stat-grid" id="stat-grid">
    <div class="stat-card"><div class="stat-label">Total Customers</div><div class="stat-value" id="stat-total-customers">–</div></div>
    <div class="stat-card"><div class="stat-label">Total Predictions</div><div class="stat-value" id="stat-total-predictions">–</div></div>
    <div class="stat-card"><div class="stat-label">High Risk</div><div class="stat-value high" id="stat-high-risk">–</div></div>
    <div class="stat-card"><div class="stat-label">Medium Risk</div><div class="stat-value medium" id="stat-medium-risk">–</div></div>
    <div class="stat-card"><div class="stat-label">Low Risk</div><div class="stat-value low" id="stat-low-risk">–</div></div>
    <div class="stat-card"><div class="stat-label">Overall Churn Rate</div><div class="stat-value accent" id="stat-churn-rate">–</div></div>
    <div class="stat-card"><div class="stat-label">Avg. Churn Probability</div><div class="stat-value accent" id="stat-avg-prob">–</div></div>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <h3>Churn Distribution</h3>
      <div class="chart-wrap"><canvas id="chart-churn-distribution"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Risk Distribution</h3>
      <div class="chart-wrap"><canvas id="chart-risk-distribution"></canvas></div>
    </div>
    <div class="chart-card" style="grid-column: 1 / -1;">
      <h3>Monthly Prediction Trend</h3>
      <div class="chart-wrap"><canvas id="chart-trend"></canvas></div>
    </div>
  </div>

  <div class="section-title"><h3 style="margin:0;">Customer Segmentation</h3></div>
  <div class="charts-grid">
    <div class="chart-card">
      <h3>By Contract Type</h3>
      <div class="chart-wrap"><canvas id="chart-seg-contract"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>By Payment Method</h3>
      <div class="chart-wrap"><canvas id="chart-seg-payment"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>By Internet Service</h3>
      <div class="chart-wrap"><canvas id="chart-seg-internet"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>By Tenure Group</h3>
      <div class="chart-wrap"><canvas id="chart-seg-tenure"></canvas></div>
    </div>
  </div>
</template>

<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/charts.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
