<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>High-Risk Customers — Signal Churn Analytics</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-shell" data-active="high-risk" data-title="High-Risk Customers"></div>

<template id="high-risk-template">
  <div class="flex-between mb-16">
    <div>
      <h2 style="margin:0;">Customers most likely to churn</h2>
      <div class="text-muted">Ranked by churn probability, using each customer's most recent prediction.</div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-toolbar">
      <div class="search-input">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="search-input" placeholder="Search by customer ID…" />
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Customer ID</th>
          <th>Tenure</th>
          <th>Contract</th>
          <th>Monthly Charges</th>
          <th>Churn Probability</th>
          <th>Risk Level</th>
          <th>Last Prediction</th>
        </tr>
      </thead>
      <tbody id="high-risk-tbody">
        <tr class="loading-row"><td colspan="7">Loading high-risk customers…</td></tr>
      </tbody>
    </table>
  </div>
</template>

<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/high-risk.js"></script>
</body>
</html>
